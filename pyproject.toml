[project]
name = "profile-service"
version = "0.1.0"
description = "Profile service (FastAPI + SQLAlchemy + Alembic)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.2",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
packages = ["src/profile_service"]

[tool.alembic]
script_location = "alembic"

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"

