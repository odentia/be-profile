name: Deploy to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Docker images to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            mkdir -p ~/profile-service
            cd ~/profile-service
            
            RABBITMQ_USER="${{ secrets.RABBITMQ_USER || 'guest' }}"
            RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD || 'guest' }}"
            
            # Находим контейнер RabbitMQ по порту 5672 или имени
            echo "Searching for RabbitMQ container..."
            RABBITMQ_CONTAINER=$(docker ps --filter "publish=5672" --format '{{.Names}}' | head -n1 || docker ps --format '{{.Names}}' | grep -i rabbitmq | head -n1 || echo "")
            if [ -z "$RABBITMQ_CONTAINER" ]; then
              echo "RabbitMQ container not found, using known IP 172.19.0.2"
              RABBITMQ_HOST="172.19.0.2"
              RABBITMQ_NETWORK=""
            else
              echo "Found RabbitMQ container: $RABBITMQ_CONTAINER"
              # Получаем сеть RabbitMQ контейнера
              RABBITMQ_NETWORK=$(docker inspect $RABBITMQ_CONTAINER --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' | head -n1 || echo "")
              echo "RabbitMQ network: $RABBITMQ_NETWORK"
              # Используем имя контейнера (лучше чем IP, так как имя не меняется)
              RABBITMQ_HOST="$RABBITMQ_CONTAINER"
              echo "Will use container name: $RABBITMQ_HOST"
            fi
            
            RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@${RABBITMQ_HOST}:5672/"
            echo "RABBITMQ_URL will be set to: amqp://$RABBITMQ_USER:***@${RABBITMQ_HOST}:5672/"
            
            # Формируем DATABASE_URL из тех же переменных, что используются для postgres
            POSTGRES_DB="${{ secrets.POSTGRES_DB || 'profiles' }}"
            POSTGRES_USER="${{ secrets.POSTGRES_USER || 'profiles_user' }}"
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            DATABASE_URL="postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@profile-service-postgres:5432/$POSTGRES_DB"
            echo "DATABASE_URL will be set to: postgresql+asyncpg://$POSTGRES_USER:***@profile-service-postgres:5432/$POSTGRES_DB"
            
            cat > docker-compose.yml << DOCKER_COMPOSE_EOF
            services:
              postgres:
                image: postgres:16-alpine
                container_name: profile-service-postgres
                restart: unless-stopped
                environment:
                  POSTGRES_DB: $POSTGRES_DB
                  POSTGRES_USER: $POSTGRES_USER
                  POSTGRES_PASSWORD: $POSTGRES_PASSWORD
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - profile-service-network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              profile-service:
                image: ghcr.io/${{ github.repository_owner }}/profile-service:latest
                container_name: profile-service
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                ports:
                  - "8001:8001"
                environment:
                  - DATABASE_URL=$DATABASE_URL
                  - RABBITMQ_URL=$RABBITMQ_URL
                  - LOG_LEVEL=INFO
                networks:
                  - profile-service-network
            DOCKER_COMPOSE_EOF
            
            if [ -n "$RABBITMQ_NETWORK" ] && [ "$RABBITMQ_NETWORK" != "profile-service-network" ]; then
              sed -i '/- profile-service-network/a\                  - '"$RABBITMQ_NETWORK" docker-compose.yml
            fi
            
            cat >> docker-compose.yml << DOCKER_COMPOSE_EOF
            
            networks:
              profile-service-network:
                driver: bridge
            DOCKER_COMPOSE_EOF
            
            if [ -n "$RABBITMQ_NETWORK" ] && [ "$RABBITMQ_NETWORK" != "profile-service-network" ]; then
              cat >> docker-compose.yml << DOCKER_COMPOSE_EOF
              $RABBITMQ_NETWORK:
                external: true
            DOCKER_COMPOSE_EOF
            fi
            
            cat >> docker-compose.yml << EOF
            
            volumes:
              postgres_data:
            DOCKER_COMPOSE_EOF
            
            cat > .env << EOF
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            DATABASE_URL=${DATABASE_URL}
            EOF
            
            echo "Logging in to GHCR..."
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || exit 1
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || exit 1
            fi
            
            echo "Pulling Docker images..."
            docker compose pull || exit 1
            
            echo "Running database migrations..."
            docker compose run --rm profile-service uv run alembic upgrade head || echo "Migration failed or not needed"
            
            echo "Starting containers..."
            docker compose up -d || exit 1
            
            echo "Waiting for containers to start..."
            sleep 5
            
            echo "Checking container status..."
            docker compose ps
            
            echo "Checking logs..."
            docker compose logs --tail=50
            
            echo "Checking profile-service environment variables:"
            docker exec profile-service env | grep RABBITMQ_URL || echo "RABBITMQ_URL not found in environment"
            
            docker image prune -f
