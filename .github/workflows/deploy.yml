name: Deploy to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Docker images to GHCR"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            mkdir -p ~/profile-service
            cd ~/profile-service
            
            RABBITMQ_USER="${{ secrets.RABBITMQ_USER || 'guest' }}"
            RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD || 'guest' }}"
            RABBITMQ_HOST="${{ secrets.RABBITMQ_HOST || 'rabbitmq' }}"
            RABBITMQ_NETWORK="${{ secrets.RABBITMQ_NETWORK }}"
            RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@$RABBITMQ_HOST:5672/"
            
            cat > docker-compose.yml << EOF
            services:
              postgres:
                image: postgres:16-alpine
                container_name: profile-service-postgres
                restart: unless-stopped
                environment:
                  POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'profiles' }}
                  POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'profiles_user' }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - profile-service-network
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${{ secrets.POSTGRES_USER || 'profiles_user' }}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
              profile-service:
                image: ghcr.io/${{ github.repository_owner }}/profile-service:latest
                container_name: profile-service
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                ports:
                  - "8001:8001"
                environment:
                  - DATABASE_URL=${{ secrets.DATABASE_URL }}
                  - RABBITMQ_URL=${RABBITMQ_URL}
                  - LOG_LEVEL=INFO
                networks:
                  - profile-service-network
EOF
            
            # Добавляем внешнюю сеть RabbitMQ если указана
            if [ -n "$RABBITMQ_NETWORK" ]; then
              # Используем имя контейнера если сеть указана
              RABBITMQ_HOST="${{ secrets.RABBITMQ_CONTAINER_NAME || 'rabbitmq' }}"
              RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@$RABBITMQ_HOST:5672/"
              sed -i "s|RABBITMQ_URL=\${RABBITMQ_URL}|RABBITMQ_URL=$RABBITMQ_URL|" docker-compose.yml
              cat >> docker-compose.yml << EOF
                  - rabbitmq-network
            networks:
              profile-service-network:
                driver: bridge
              rabbitmq-network:
                external: true
                name: $RABBITMQ_NETWORK
EOF
            else
              cat >> docker-compose.yml << EOF
            networks:
              profile-service-network:
                driver: bridge
            volumes:
              postgres_data:
            EOF
            
            cat > .env << EOF
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'profiles' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'profiles_user' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EOF
            
            echo "Logging in to GHCR..."
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || exit 1
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || exit 1
            fi
            
            echo "Pulling Docker images..."
            docker compose pull || exit 1
            
            echo "Running database migrations..."
            docker compose run --rm profile-service uv run alembic upgrade head || echo "Migration failed or not needed"
            
            echo "Starting containers..."
            docker compose up -d || exit 1
            
            echo "Waiting for containers to start..."
            sleep 5
            
            echo "Checking container status..."
            docker compose ps
            
            echo "Checking logs..."
            docker compose logs --tail=50
            
            docker image prune -f
