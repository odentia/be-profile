services:
  postgres:
    image: postgres:16-alpine
    container_name: profile-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-profiles}
      POSTGRES_USER: ${POSTGRES_USER:-profiles_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - profile-service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-profiles_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  profile-service:
    # На сервере замените YOUR_GITHUB_USERNAME на ваш GitHub username
    # Например: ghcr.io/yourusername/profile-service:latest
    image: ghcr.io/YOUR_GITHUB_USERNAME/profile-service:latest
    container_name: profile-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ALEMBIC_DATABASE_URL=${ALEMBIC_DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-localhost:3000,localhost:3010,localhost:3020,localhost:3030}
      - ENV=prod
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - profile-service-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/docs\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  profile-service-network:
    driver: bridge

volumes:
  postgres_data:
